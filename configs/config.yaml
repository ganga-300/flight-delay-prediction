# Central experiment configuration. All paths relative to repo root.
seed: 42

paths:
  # Development data: Jan-Oct only, created by scripts/seal_holdout.py. Every notebook, test and
  # build reads this file. The Nov-Dec test period is not in it.
  raw: data/interim/flights_dev.csv
  # Full 2013 file including the Nov-Dec holdout. SEALED: read only by scripts/seal_holdout.py
  # and, once, by the final test evaluation (docs/decision_log.md, D-002).
  raw_sealed: data/raw/flights.csv
  interim: data/interim
  processed: data/processed
  models: models
  figures: reports/figures
  results: reports/results

target:
  column: arr_delay
  threshold_minutes: 15              # BTS on-time convention
  cancelled_policy: exclude          # D-011: flights without an arrival-delay value are excluded

decision_time:
  # Features for a flight on date D use only the published schedule and outcomes known by the
  # end of day D-1 (see docs/leakage_policy.md). Alternative considered: "sched_dep_minus_2h".
  mode: d_minus_1

split:                               # D-013: chronological, inclusive date ranges
  train: ["2013-01-01", "2013-08-31"]
  valid: ["2013-09-01", "2013-10-31"]
  test:  ["2013-11-01", "2013-12-31"]

features:
  history_windows_days: [1, 7, 28]   # rolling past-only windows ending at D-1 (1 = previous day)
  history_include_all_past: true     # also an expanding all-past window
  history_prior_strength: 20         # m in (k + m*p0) / (n + m) smoothing toward global past rate
  categorical_min_count: 50          # train rows needed to keep a category level (else __OTHER__)
  cyclic: [hour, day_of_week]          # month/day-of-year excluded: unseen months in valid/test

evaluation:
  operational_precision: 0.60        # D-015: assumption; threshold infeasible on October (D-204)
  calibration_bins: 10

# Model settings are not configured here. The hyperparameter grid and selection rule are in D-201
# (docs/decision_log.md); the selected model and its settings are in D-202 and
# models/d201/final_training.json.
