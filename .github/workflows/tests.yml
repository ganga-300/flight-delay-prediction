# Runs the full test suite, including the holdout, feature-set, config and experiment-plan guards
# (docs/decision_log.md, D-108), on every pull request and on every push to ml-restart.
# Make the "tests" check required in the branch protection rule for ml-restart.
name: tests

on:
  pull_request:
  push:
    branches: [ml-restart]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history and tags: run records are checked against it

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create the Jan-Oct development file (holdout stays sealed)
        run: python scripts/seal_holdout.py

      - name: Build the frozen feature set
        run: python scripts/build_features.py

      - name: Run tests
        run: pytest -q
