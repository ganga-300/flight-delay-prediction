[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flight-delay"
version = "0.1.0"
description = "Pre-departure flight arrival-delay prediction (Project 21, Phase 1)"
requires-python = ">=3.10"
authors = [{ name = "Ganga Raghuwanshi" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Executed exploratory notebooks are part of the evidence record (D-101 to D-106), so their code is
# not rewritten for style. Long lines, import order, an unused import and zip() on equal-length
# lists do not affect any output.
"notebooks/*.ipynb" = ["E501", "I001", "F401", "B905"]
